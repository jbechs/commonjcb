<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intercom Broadcast Test</title>
<style>
html,body{margin:0;min-height:100%;background:#2a0508;color:white;font-family:system-ui,-apple-system,sans-serif}
body{display:grid;place-items:center;min-height:100vh}
main{width:min(92vw,520px);text-align:center}
button{font:inherit;font-size:1.25rem;padding:18px 28px;border-radius:14px;border:0}
.status{margin-top:18px;opacity:.9;line-height:1.5}
.small{margin-top:14px;font-size:.8rem;opacity:.65;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Broadcast Test</h1>
<button id="broadcast">Broadcast</button>
<div id="status" class="status">Ready.</div>
<div class="small">Channel: common-intercom-test-4022e9fe82b4</div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const CHANNEL = "common-intercom-test-4022e9fe82b4";
const btn = document.getElementById('broadcast');
const statusEl = document.getElementById('status');
let peer = null;
let stream = null;
let calls = new Map();

function setStatus(s){ statusEl.textContent = s; }

btn.addEventListener('click', async ()=>{
  if(peer) return;
  btn.disabled = true;
  setStatus('Requesting microphone…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation:true, noiseSuppression:true, autoGainControl:true},
      video:false
    });
    setStatus('Opening broadcast channel…');
    peer = new Peer(CHANNEL);

    peer.on('open', id=>{
      setStatus('LIVE MIC — waiting for listeners.');
      btn.textContent = 'Broadcasting';
    });

    peer.on('connection', conn=>{
      setStatus('Incoming listener seen…');
      conn.on('open', ()=>{
        try { conn.send({type:'listener-ready'}); } catch(_e) {}
        const call = peer.call(conn.peer, stream);
        calls.set(conn.peer, call);
        call.on('close', ()=>{
          calls.delete(conn.peer);
          setStatus(`LIVE MIC — ${calls.size} listener${calls.size===1?'':'s'}.`);
        });
        setStatus(`LIVE MIC — ${calls.size} listener${calls.size===1?'':'s'}.`);
      });
    });

    peer.on('error', err=>{
      setStatus('Peer error: ' + (err.type || err.message || 'unknown'));
      btn.disabled = false;
    });
  } catch(err) {
    setStatus('Mic error: ' + (err.message || err));
    btn.disabled = false;
  }
});
</script>
</main>
</body>
</html>
